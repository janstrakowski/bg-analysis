<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ tytul }}</title>
  <link rel="stylesheet" href="{{ korzen }}style.css">
</head>
<body data-korzen="{{ korzen }}">
  <a class="pomin" href="#tresc">Przejdź do treści</a>
  <header class="pasek">
    <a class="znak" href="{{ korzen }}index.html">Biblia Gdańska</a>
    <form id="skok">
      <label for="adres">Przejdź do</label>
      <input id="adres" name="adres" placeholder="Ps 22,17" autocomplete="off">
      <button type="submit">Idź</button>
    </form>
    <p id="skok-blad" class="cicho" hidden></p>
  </header>
  <main id="tresc">
    {% block tresc %}{% endblock %}
  </main>
  <footer>
    <p>Porównanie Biblii Gdańskiej z 1879 roku z tekstem masoreckim i Textus Receptus. Werdykt opisuje przekład, nie źródło.</p>
  </footer>
  <script src="{{ korzen }}skok.js"></script>
</body>
</html>
